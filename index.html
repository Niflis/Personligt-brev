<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karriärassistenten</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f4f6f8;
    color: #1f2937;
}

.header {
    background: linear-gradient(135deg, #0f5e74, #12708a);
    color: white;
    text-align: center;
    padding: 40px 20px;
}

.header h1 {
    margin: 0 0 10px 0;
    font-size: 2rem;
}

.header p {
    margin: 0;
    opacity: 0,95;
    max-width: 700px;
    margin-inline: auto;
    line-height: 1.5;
}

.container {
    max-width: 1200px;
    margin: 30px auto;
    padding: 0 20px;
}

.card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    overflow: hidden;
}

.chat {
    height: 900px;
}

.chat iframe {
    width: 100%;
    height: 100%;
    border: none;
}

.features {
    display: flex;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 25px;
}

.feature {
    background: white;
    border-radius: 12px;
    padding: 15px 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    font-size: 14px;
}

.footer {
    text-align: center;
    color: #6b7280;
    font-size: 12px;
    padding: 20px;
}

@media (max-width: 768px) {

    .header {
        padding: 25px 15px;
    }

    .header h1 {
        font-size: 1.5rem;
    }

    .chat {
        height: 80vh;
    }

}
</style>
</head>

<body>

<div class="header">
    <h1>Personligt brev-agent</h1>
    <p>
        Klistra in en jobbannons för att få hjälp med
        personliga brev och ansökningshandlingar.
    </p>
</div>

<div class="container">

    <div class="features">
        <div class="feature">✍️ Skapa personligt brev</div>
        <div class="feature">🎯 Matcha mot jobbannons</div>
        <div class="feature">⚡ Snabb återkoppling</div>
    </div>

    <div class="card">

        <div class="chat">
            <iframe
                src="https://copilotstudio.microsoft.com/environments/Default-643a251a-3b7a-4729-81d4-9a60d14b47c2/bots/ca_agentruwdX6/webchat?__version__=2&enableFileAttachment=true">
            </iframe>
        </div>

    </div>

</div>

<div class="footer">
    Karriärassistenten
</div>

</body>
</html>
